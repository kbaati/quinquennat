spring.application.name=backend

# Python engine (OpenFisca-France). A first call with a new reform takes a few seconds.
engine.url=${MOTEUR_URL:http://localhost:8000}
engine.connect-timeout=2s
engine.read-timeout=60s

# Shared simulations
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/quinquennat}
spring.datasource.username=${DATABASE_USER:quinquennat}
spring.datasource.password=${DATABASE_PASSWORD:quinquennat}

simulations.rate-limit-per-minute=${SIMULATIONS_RATE_LIMIT_PER_MINUTE:20}

# Behind a reverse proxy, "native" makes the rate limiter see the real client IP.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

springdoc.api-docs.path=/api/openapi
