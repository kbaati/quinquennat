services:
  moteur:
    build:
      context: .
      dockerfile: moteur/Dockerfile
      target: runtime
    ports:
      - "${MOTEUR_PORT:-8000}:8000"

  backend:
    build: ./backend
    environment:
      MOTEUR_URL: http://moteur:8000
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      - moteur

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
